// CÁLCULOS MATEMÁTICOS DE BIC
function calcMlh(droga, dose, peso, conc) {
if (droga.id === 'azulmetileno') return 83.3;
if (droga.unidade === 'mcg/kg/min') return (dose * peso * 60) / conc;
if (droga.unidade === 'mcg/min' || droga.unidade === 'UI/min' || droga.unidade === 'mg/min') return (dose * 60) / conc;
if (droga.unidade === 'mg/kg/h' || droga.unidade === 'mcg/kg/h') return (dose * peso) / conc;
if (droga.unidade === 'mEq/h' || droga.unidade === 'g/h') return dose / conc;
return 0;
}
function calcDoseFromMlh(droga, mlh, peso, conc) {
if (droga.id === 'azulmetileno') return droga.padrao;
if (droga.unidade === 'mcg/kg/min') return (mlh * conc) / (peso * 60);
if (droga.unidade === 'mcg/min' || droga.unidade === 'UI/min' || droga.unidade === 'mg/min') return (mlh * conc) / 60;
if (droga.unidade === 'mg/kg/h' || droga.unidade === 'mcg/kg/h') return (mlh * conc) / peso;
if (droga.unidade === 'mEq/h' || droga.unidade === 'g/h') return mlh * conc;
return 0;
}

${cats.map(c => ⁠<option value="${c}" ${state.filtroCat === c ? 'selected' : ''}>${c}</option>⁠).join('')}
</select>
</div>
<div class="space-y-4 pb-8">
${filtrados.map(atb => {
const doseObj = atb.doses[state.clearance];
let doseTxt = '';
if (!doseObj) doseTxt = 'Sem dados / Não recomendado';
else if (typeof doseObj === 'string') doseTxt = doseObj;
else if (doseObj.doseFixa) doseTxt = ⁠${doseObj.doseFixa}mg${doseObj.freq}⁠;
else {
let total = Math.round(doseObj.val * state.peso);
if (doseObj.max && total > doseObj.max) total = doseObj.max;
doseTxt = ⁠${total}${doseObj.unid \vert{}\vert{} 'mg'} (${doseObj.val}${doseObj.unid \vert{}\vert{} 'mg'}/kg)${doseObj.freq}⁠;
}
return ⁠<div class="bg-slate-800 border border-slate-700 rounded-xl p-3 shadow-sm"> <div class="flex justify-between items-start mb-1"> <h3 class="font-semibold text-sm text-slate-100">${atb.nome}</h3> <span class="text-[9px] text-slate-400 uppercase bg-slate-900 px-1.5 py-0.5 rounded border border-slate-700">${atb.classe}</span> </div> <div class="bg-slate-900/80 border border-cyan-500/30 rounded p-2.5 mt-2"> <span class="text-sm text-cyan-400 font-bold">${doseTxt}</span> </div> <div class="mt-2 text-[10px] text-slate-500 border-t border-slate-700/50 pt-2 space-y-1"> <div>${atb.diluicao || ''} • <strong class="text-rose-300">${atb.via \vert{}\vert{} ''}</strong></div>${atb.obs ?⁠<div class="text-slate-400">${atb.obs}</div>⁠ : ''} </div> </div>⁠;
}).join('')}
</div>
</div>`;
}

// MOTOR PRINCIPAL DE ATUALIZAÇÃO DA TELA (VANILLA RENDER)
function renderApp() {
// Atualiza peso no header
document.getElementById('val-peso-global').innerText = state.peso;
// Renderiza abas
document.querySelectorAll('.tab-btn').forEach(btn => {
const tab = btn.getAttribute('data-tab');
if (tab === state.abaAtual) {
btn.className = 'tab-btn px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 border-cyan-400 text-cyan-400';
} else {
btn.className = 'tab-btn px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 border-transparent text-slate-400 hover:text-slate-200' + (tab === 'ANTIBIÓTICOS' ? ' lg:hidden' : '');
}
});
// Conteúdo principal
const main = document.getElementById('main-content');
if (state.abaAtual === 'VASOATIVOS') {
main.innerHTML = ⁠<div class="grid gap-6 md:grid-cols-2">${drogasVasoativas.map(d => renderDrugCard(d)).join('')}</div>⁠;
} else if (state.abaAtual === 'INOTRÓPICOS') {
main.innerHTML = ⁠<div class="grid gap-6 md:grid-cols-2">${inotropicos.map(d => renderDrugCard(d)).join('')}</div>⁠;
} else if (state.abaAtual === 'SEDOANALGESIA') {
main.innerHTML = ⁠<div class="grid gap-6 md:grid-cols-2">${sedoanalgesia.map(d => renderDrugCard(d)).join('')}</div>⁠;
} else if (state.abaAtual === 'ARRITMIA') {
main.innerHTML = ⁠<div class="grid gap-6 md:grid-cols-2">${arritmia.map(d => renderDrugCard(d)).join('')}</div>⁠;
} else if (state.abaAtual === 'DHE') {
main.innerHTML = renderDheHtml();
// Atualiza cálculo de sódio
const naAtual = parseFloat(document.getElementById('na-atual')?.value || 115);
const naAlvo = parseFloat(document.getElementById('na-alvo')?.value || 125);
const act = state.peso * 0.6;
const defNa = Math.max(0, act * (naAlvo - naAtual));
const vazao = (defNa / 0.513) / 24;
const elSodio = document.getElementById('dhe-sodio-res');
if (elSodio) {
elSodio.innerHTML = ⁠<div> <p class="text-[10px] uppercase font-bold text-slate-400">Déficit de Sódio</p> <span class="text-xl font-bold font-mono">${defNa.toFixed(0)} mEq</span> </div> <div class="text-right"> <p class="text-[10px] uppercase font-bold text-slate-400">Vazão NaCl 3% (24h)</p> <span class="text-2xl font-bold font-mono">${vazao.toFixed(1)} mL/h</span> </div>⁠;
}
} else if (state.abaAtual === 'ANTIBIÓTICOS') {
main.innerHTML = renderAntibioticosHtml();
} else if (state.abaAtual === 'IOT') {
main.innerHTML = renderIotHtml();
}
// Painel lateral de ATB (Desktop)
const side = document.getElementById('side-atb-container');
if (state.abaAtual !== 'IOT' && state.abaAtual !== 'ANTIBIÓTICOS') {
side.classList.remove('hidden');
side.innerHTML = renderAntibioticosHtml();
} else {
side.classList.add('hidden');
}
}
// HANDLERS E EVENTOS DO USUÁRIO
function setTab(tab) {
state.abaAtual = tab;
renderApp();
window.scrollTo({ top: 0, behavior: 'smooth' });
}
function setDiluicao(id, key) {
state.drogas[id].dilKey = key;
renderApp();
}
function handleDoseChange(id, val) {
state.drogas[id].dose = parseFloat(val);
renderApp();
}
function setDoseDirect(id, val) {
state.drogas[id].dose = parseFloat(val);
renderApp();
}
function handleMlhChange(id, val) {
const todas = [...drogasVasoativas, ...inotropicos, ...sedoanalgesia, ...arritmia, ...dheDrogas];
const d = todas.find(x => x.id === id);
const dil = d.diluicoes[state.drogas[id].dilKey];
state.drogas[id].dose = calcDoseFromMlh(d, parseFloat(val), state.peso, dil.conc);
renderApp();
}
function setClearance(val) {
state.clearance = val;
renderApp();
}
function setFiltroCat(val) {
state.filtroCat = val;
renderApp();
}
function toggleModalCrCl(open) {
const m = document.getElementById('modal-crcl');
if (open) m.classList.remove('hidden'), m.classList.add('flex');
else m.classList.add('hidden'), m.classList.remove('flex');
}
function setSexoBiologico(s) {
state.crclSexo = s;
document.getElementById('btn-sexo-m').className = s === 'M' ? 'flex-1 py-1.5 text-xs font-semibold rounded bg-cyan-600 text-white' : 'flex-1 py-1.5 text-xs font-semibold rounded text-slate-400';
document.getElementById('btn-sexo-f').className = s === 'F' ? 'flex-1 py-1.5 text-xs font-semibold rounded bg-pink-600 text-white' : 'flex-1 py-1.5 text-xs font-semibold rounded text-slate-400';
}
function aplicarCrCl() {
let cg = ((140 - state.crclIdade) * state.peso) / (72 * state.crclCr);
if (state.crclSexo === 'F') cg *= 0.85;
if (cg >= 50) state.clearance = '>50';
else if (cg >= 10) state.clearance = '10-50';
else state.clearance = '<10';
toggleModalCrCl(false);
renderApp();
}
// BINDING DE SLIDERS DO MODAL E DO PESO
document.getElementById('slider-peso').addEventListener('input', (e) => {
state.peso = parseFloat(e.target.value);
renderApp();
});
document.getElementById('crcl-cr').addEventListener('input', (e) => {
state.crclCr = parseFloat(e.target.value);
document.getElementById('crcl-cr-val').innerText = ⁠${state.crclCr.toFixed(1)} mg/dL⁠;
});
document.getElementById('crcl-idade').addEventListener('input', (e) => {
state.crclIdade = parseInt(e.target.value);
document.getElementById('crcl-idade-val').innerText = ⁠${state.crclIdade} anos⁠;
});
// INICIALIZAÇÃO IMEDIATA
initDrogasState();
renderApp();
</script>
